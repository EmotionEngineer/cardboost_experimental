[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardboost"
version = "1.0.0"
description = "Rate-Distortion Optimal Glass-Box Scorecards. Ultra-compact (<= 4 KB) piecewise-constant additive models with bit-exact SQL, C99, and binary deployment."
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "Islam Tlupov", email = "tlupovislam@gmail.com"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]
keywords = ["scorecard", "glass-box", "interpretable ML", "Potts", "MDL", "credit scoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
qr = ["qrcode>=7.0"]
fast = ["numba>=0.56"]
dev = ["pytest>=7.0", "pytest-timeout>=2.1"]

[project.urls]
Homepage = "https://github.com/EmotionEngineer/cardboost_experimental"

[tool.setuptools.packages.find]
include = ["cardboost*"]

[tool.setuptools.package-data]
cardboost = ["_vendor/*.py"]
"cardboost.datasets" = ["*.npz"]

[tool.pytest.ini_options]
markers = [
    "golden: metric-anchored golden tests against the canonical R87 table (slow)",
    "matrix: full matrix mode - all presets x all folds vs golden/matrix_baseline.json (slow)",
    "slow: long-running tests",
]
timeout = 3600
